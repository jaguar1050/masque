<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screenAIr &middot; Prototype</title>
<meta name="description" content="screenAIr: one screening program with a module selector, a Clinician Screener, an Ambient Scribe, a Patient Companion, Research and a Rubric Editor. Prototype; not for clinical use.">
<!-- Prototype, not a published tool: keep it out of search results. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f5ead8'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23c67139'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Georgia,serif' font-size='52' fill='%23f5ead8'%3EM%3C/text%3E%3C/svg%3E">

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
  }
}
</script>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- defer: the loading screen paints before Babel standalone arrives. Deferred scripts run
     before module scripts, in document order, and the loader also waits for window.Babel. -->
<script defer src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #EDF3F1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  #masque-status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #f5ead8; color: #6b5744; font-size: 14px; z-index: 9998;
  }
  #masque-status::before {
    content: ""; width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #e0cfae; border-top-color: #c67139;
    animation: masque-spin 0.8s linear infinite;
  }
  @keyframes masque-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #masque-status::before { animation: none; } }

  .masque-proto {
    position: fixed; right: 12px; bottom: 12px; z-index: 9997;
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: #8E3520; background: #fbe4d8; border: 1px solid #f0c3ad;
    padding: 6px 12px; border-radius: 999px;
  }
  @media (max-width: 640px) { .masque-proto { display: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <div id="masque-status">Loading screenAIr&hellip;</div>

  <div class="masque-proto">Prototype &middot; not for clinical use</div>

  <noscript>
    <p style="padding:24px;font:15px/1.6 -apple-system,sans-serif;color:#6b5744">
      screenAIr is a React application and needs JavaScript enabled.
      Prototype &middot; not for clinical use.
    </p>
  </noscript>

  <script type="module">
    // The loader URL carries the release (?v=), so a browser that cached an older loader fetches
    // this one. A loader that cannot be imported, or lacks a function this page needs, is shown
    // as an error instead of an endless "Loading…".
    const LOADER = './assets/masque-loader.js?v=0.4.0';
    const fail = (err) => {
      const status = document.getElementById('masque-status');
      if (status) status.remove();
      const panel = document.createElement('div');
      panel.setAttribute('role', 'alert');
      panel.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;z-index:99999;max-height:45vh;overflow:auto;' +
        'font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;' +
        'background:#2a1215;color:#ff8a80;border:1px solid #5c2b2e;border-radius:10px;padding:12px 16px;';
      panel.textContent = 'screenAIr failed to start: the page loader could not be loaded.\n' +
        'Reload the page (Ctrl+F5 or Cmd+Shift+R). Prototype \u00b7 not for clinical use.\n\n' +
        (err && err.stack ? err.stack : String(err));
      document.body.appendChild(panel);
      console.error('[masque]', err);
    };
    import(LOADER).then((L) => {
      const missing = ['boot', 'importModule', 'importSource', 'inspectSource'].filter((k) => typeof L[k] !== 'function');
      if (missing.length) throw new Error(`${LOADER} is an older version without ${missing.join(', ')}`);
      const env = { loader: { importModule: L.importModule, importSource: L.importSource, inspectSource: L.inspectSource }, appBase: new URL('./', document.baseURI).href };
      return L.boot({ entry: './src/shell/ScreenAIr.jsx', props: { env } });
    }).catch(fail);
  </script>
</body>
</html>
