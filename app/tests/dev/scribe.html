<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient Scribe &middot; dev page &middot; Prototype</title>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",

<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #EDF3F1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  #masque-status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #f5ead8; color: #6b5744; font-size: 14px; z-index: 9998;
  }
  #masque-status::before {
    content: ""; width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #e0cfae; border-top-color: #c67139;
    animation: masque-spin 0.8s linear infinite;
  }
  @keyframes masque-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #masque-status::before { animation: none; } }

  .masque-proto {
    position: fixed; right: 12px; bottom: 12px; z-index: 9997;
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: #8E3520; background: #fbe4d8; border: 1px solid #f0c3ad;
    padding: 6px 12px; border-radius: 999px;
  }
  @media (max-width: 640px) { .masque-proto { display: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <div id="masque-status">Loading the Ambient Scribe&hellip;</div>

  <div class="masque-proto">Prototype &middot; not for clinical use</div>

  <noscript>
    <p style="padding:24px;font:15px/1.6 -apple-system,sans-serif;color:#6b5744">
      This test page is a React application and needs JavaScript enabled.
      Prototype &middot; not for clinical use.
    </p>
  </noscript>

  <script type="module">
    import { boot, importModule, importSource, inspectSource } from '../../assets/masque-loader.js';
    const env = { loader: { importModule, importSource, inspectSource }, appBase: new URL('../../', location.href).href };
    boot({ entry: './MountScribe.jsx', props: { env } });
  </script>
</body>
</html>
