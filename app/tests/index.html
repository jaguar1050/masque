<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screenAIr self-check &middot; Prototype (local only)</title>
<meta name="robots" content="noindex, nofollow">

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #EDF3F1; color: #0C2B2F; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .t-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  .t-sub { color: #5C6E6C; font-size: 13px; margin: 0 0 8px; }
  .t-card { background: #fff; border: 1px solid #D7E1DF; border-radius: 12px; padding: 14px 16px; margin-top: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #D7E1DF; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #5C6E6C; }
  td:nth-child(6) { min-width: 360px; }
  pre { white-space: pre-wrap; margin: 4px 0 0; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .t-note { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .t-pass { color: #2C7A57; font-weight: 700; } .t-fail { color: #B84A33; font-weight: 700; }
  .t-invalid { color: #7A2CA0; font-weight: 700; } .t-run { color: #5C6E6C; }
  .t-summary { font-size: 15px; font-weight: 650; }
  ol { margin: 6px 0 0; padding-left: 20px; } li { margin: 4px 0; }
  .t-proto { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #8E3520; background: #fbe4d8; border: 1px solid #f0c3ad; padding: 6px 12px; border-radius: 999px; display: inline-block; margin-top: 18px; }
  #masque-status { padding: 24px 16px; color: #5C6E6C; }
</style>
</head>
<body>
<div id="masque-status">Loading the test harness&hellip;</div>
<div id="root"></div>

<script type="module">
import { importModule, importSource, inspectSource } from '../assets/masque-loader.js';

const env = { loader: { importModule, importSource, inspectSource }, appBase: new URL('../', location.href).href };
const status = document.getElementById('masque-status');

importModule('./harness/runner.js')
  .then(({ run }) => { if (status) status.remove(); return run(env); })
  .catch((err) => {
    if (status) status.textContent = 'The test harness failed to load: ' + (err && err.stack ? err.stack : String(err));
    window.__screenairTests = { verdict: 'fail', error: String(err && err.message || err), suites: [] };
    document.documentElement.dataset.masqueTests = 'fail';
  });
</script>
</body>
</html>
